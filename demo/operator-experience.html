<style>
#epm-design{--epm-bg:light-dark(#f5f4f0,#202421);--epm-surface:light-dark(#fff,#292e2b);--epm-ink:light-dark(#20332e,#edf2ef);--epm-muted:light-dark(#63716a,#b0bcb5);--epm-line:light-dark(#e1e6df,#414b44);--epm-accent:light-dark(#176957,#8ed7bf);--epm-soft:light-dark(#e8f2ec,#30453b);--epm-warn:light-dark(#8a5318,#eab879);--epm-warn-bg:light-dark(#fcf2df,#483b28);--epm-danger:light-dark(#a33630,#ffb0a5);--epm-danger-bg:light-dark(#fbefec,#49312e);--epm-pad:20px;color:var(--epm-ink);background:var(--epm-bg);font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;border:1px solid var(--epm-line);border-radius:14px;overflow:clip;position:relative}
#epm-design *{box-sizing:border-box}#epm-design button,#epm-design input,#epm-design select{font:inherit}#epm-design button{color:inherit;cursor:inherit}#epm-design button:focus-visible,#epm-design input:focus-visible{outline:3px solid var(--epm-accent);outline-offset:3px}#epm-design button{border:1px solid var(--epm-line);background:var(--epm-surface);border-radius:7px;padding:8px 12px}#epm-design button:hover{background:var(--epm-soft)}#epm-design button.primary{background:var(--epm-accent);color:var(--epm-surface);border-color:var(--epm-accent)}#epm-design button.link{border:0;background:transparent;color:var(--epm-accent);padding:3px 0;text-align:left}#epm-design h1{font-size:28px;line-height:1.2;letter-spacing:-.7px;font-weight:500;margin:4px 0 8px}#epm-design h2{font-size:17px;font-weight:500;margin:0}#epm-design h3{font-size:14px;font-weight:500;margin:0}#epm-design p{margin:5px 0}#epm-design small{font-size:12px;color:var(--epm-muted)}#epm-design .muted{color:var(--epm-muted)}#epm-design strong{font-weight:500}#epm-design .chrome{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 20px;border-bottom:1px solid var(--epm-line);background:var(--epm-surface)}#epm-design .brand{display:flex;align-items:center;gap:10px;font-weight:500;letter-spacing:-.3px}#epm-design .brandmark{width:29px;height:29px;background:var(--epm-soft);color:var(--epm-accent);display:grid;place-items:center;border-radius:8px}#epm-design .shell{display:grid;grid-template-columns:165px minmax(0,1fr)}#epm-design aside{background:var(--epm-surface);padding:20px 12px;display:flex;flex-direction:column;gap:5px;border-right:1px solid var(--epm-line)}#epm-design aside button{text-align:left;display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:10px;border-radius:7px}#epm-design aside button[aria-current=page]{background:var(--epm-soft);color:var(--epm-accent);font-weight:500}#epm-design .navfoot{margin-top:auto;padding-top:40px}#epm-design .status{padding:14px 9px 0;font-size:12px;color:var(--epm-muted)}#epm-design main{padding:26px;min-width:0;min-height:600px}#epm-design .eyebrow{font-size:12px;color:var(--epm-muted)}#epm-design .pagehead{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}#epm-design .panel{background:var(--epm-surface);border:1px solid var(--epm-line);border-radius:10px;overflow:hidden;margin-top:16px}#epm-design .panelhead{padding:15px var(--epm-pad);display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--epm-line)}#epm-design .row{padding:var(--epm-pad);display:flex;gap:13px;align-items:flex-start;border-bottom:1px solid var(--epm-line)}#epm-design .row:last-child{border-bottom:0}#epm-design .grow{flex:1;min-width:0}#epm-design .row p{font-size:13px;color:var(--epm-muted)}#epm-design .tag{display:inline-block;border-radius:5px;padding:3px 7px;font-size:12px;white-space:nowrap;background:var(--epm-soft);color:var(--epm-accent)}#epm-design .tag.warn{background:var(--epm-warn-bg);color:var(--epm-warn)}#epm-design .tag.danger{background:var(--epm-danger-bg);color:var(--epm-danger)}#epm-design .urgent-dot{width:8px;height:8px;border-radius:50%;background:var(--epm-danger);margin-top:8px;flex:none}#epm-design .tabs{display:flex;gap:18px;flex-wrap:wrap;margin:16px 0 0;border-bottom:1px solid var(--epm-line)}#epm-design .tabs button{background:transparent;border:0;border-radius:0;padding:10px 0;color:var(--epm-muted);border-bottom:2px solid transparent}#epm-design .tabs button[aria-pressed=true]{color:var(--epm-accent);border-bottom-color:var(--epm-accent)}#epm-design .appointment{display:flex;gap:14px;align-items:center;border-left:3px solid var(--epm-accent);padding:12px 16px;background:var(--epm-soft);border-radius:0 8px 8px 0}#epm-design .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}#epm-design .two .panel{margin-top:16px}#epm-design .coverage{padding:16px var(--epm-pad)}#epm-design .coverline{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--epm-line)}#epm-design .coverline:last-child{border:0}#epm-design .textwarn{color:var(--epm-warn)}#epm-design .avatar{display:grid;place-items:center;width:46px;height:46px;border-radius:10px;background:var(--epm-soft);color:var(--epm-accent);font-size:18px;flex:none}#epm-design .breadcrumb{margin-bottom:16px;display:flex;gap:8px;color:var(--epm-muted);font-size:12px}#epm-design .quiet{padding:27px var(--epm-pad)}#epm-design .drawer{background:var(--epm-surface);border:1px solid var(--epm-line);border-radius:10px;padding:22px;margin-top:18px;box-shadow:0 8px 24px light-dark(#20332e12,#00000025)}#epm-design .drawerhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}#epm-design .fields{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}#epm-design label{display:flex;flex-direction:column;gap:5px}#epm-design input,#epm-design select{width:100%;min-width:0;background:var(--epm-bg);color:var(--epm-ink);border:1px solid var(--epm-line);padding:9px;border-radius:6px}#epm-design .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}#epm-design .settingrow{display:flex;align-items:center;gap:12px;padding:12px var(--epm-pad);border-bottom:1px solid var(--epm-line)}#epm-design .settingrow label{flex-direction:row;align-items:center;flex:1}#epm-design input[type=checkbox]{width:17px;height:17px;accent-color:var(--epm-accent)}#epm-design .settingrow button{padding:4px 10px}#epm-design .notice{padding:12px 16px;background:var(--epm-soft);border-radius:7px;margin:14px 0}#epm-design .footer{display:flex;justify-content:space-between;gap:12px;padding:10px 20px;border-top:1px solid var(--epm-line);color:var(--epm-muted);font-size:12px;background:var(--epm-surface)}#epm-design .searchbar{display:flex;gap:8px;align-items:center}#epm-design .searchbar button{padding:6px 10px;color:var(--epm-muted);font-size:12px}#epm-design .result{display:block;width:100%;text-align:left;margin:8px 0}#epm-design .money{font-variant-numeric:tabular-nums}#epm-design [hidden]{display:none!important}
@media(max-width:760px){#epm-design .shell{grid-template-columns:1fr}#epm-design aside{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--epm-line);padding:8px}#epm-design aside button{padding:7px}#epm-design .navfoot{margin:0;padding:0}#epm-design .status{display:none}#epm-design main{padding:18px;min-height:0}#epm-design .two{grid-template-columns:1fr}#epm-design .chrome{padding:12px}#epm-design .pagehead{align-items:flex-start}#epm-design .row{flex-wrap:wrap}#epm-design .row>.grow{flex-basis:65%}#epm-design .tabs{gap:13px}#epm-design .footer{flex-wrap:wrap}}
@media(max-width:430px){#epm-design .fields{grid-template-columns:1fr}#epm-design .chrome{flex-wrap:wrap}#epm-design .pagehead{flex-direction:column}#epm-design .appointment{flex-wrap:wrap}#epm-design .coverline{flex-wrap:wrap}}
#epm-design .property-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:18px}#epm-design .property-card{background:var(--epm-surface);border:1px solid var(--epm-line);border-radius:10px;overflow:hidden}#epm-design .property-mark{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--epm-soft);color:var(--epm-accent);font-size:12px}#epm-design .property-content{padding:18px}#epm-design .cardbottom{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}#epm-design .directory-controls{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin:20px 0 12px}#epm-design .directory-controls label:first-child{flex:1;min-width:150px}#epm-design .directory-controls label{font-size:12px;color:var(--epm-muted)}#epm-design .directory-controls input,#epm-design .directory-controls select{font-size:14px}#epm-design .workspace-back{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px;flex-wrap:wrap}#epm-design .workspace-back label{flex-direction:row;align-items:center;font-size:12px;color:var(--epm-muted);gap:10px}#epm-design .workspace-back select{width:auto;max-width:220px}#epm-design .directory-note{font-size:12px;margin-top:15px}#epm-design .inline-expansion{margin:0;padding:20px;background:var(--epm-bg);border:0;border-bottom:1px solid var(--epm-line);border-left:3px solid var(--epm-accent);border-radius:0;box-shadow:none}#epm-design .appointment+.inline-expansion{margin-bottom:16px}#epm-design button[aria-expanded=true]{color:var(--epm-accent);text-decoration:underline;text-underline-offset:4px}#epm-design button.primary[aria-expanded=true]{color:var(--epm-surface)}#epm-design .inline-expansion .inline-expansion{margin-top:12px}#epm-design .directory-controls input{font-size:16px}
@media(max-width:580px){#epm-design .property-grid{grid-template-columns:1fr}#epm-design .workspace-back{align-items:flex-start}#epm-design .workspace-back label{flex-wrap:wrap}}
#epm-design .toggle-hint{display:flex;gap:8px;align-items:center;color:var(--epm-muted);font-size:12px;margin:0 0 16px}#epm-design .toggle-chevron{display:inline-block;margin-left:7px;text-decoration:none}#epm-design [aria-expanded=true]>.toggle-chevron{transform:rotate(180deg)}#epm-design .appearance-options{display:flex;gap:8px;flex-wrap:wrap}#epm-design .appearance-options button[aria-pressed=true]{background:var(--epm-soft);color:var(--epm-accent);border-color:var(--epm-accent)}
@media(pointer:coarse){#epm-design button{min-height:44px}}
</style>
<div id="epm-design" aria-label="Property management screen design">
  <header class="chrome"><div class="brand"><span class="brandmark"><i data-lucide="house" aria-hidden="true"></i></span> Easy Property</div><div class="searchbar"><small>Oak &amp; Pine workspace</small><button type="button" data-action="search" class="cursor-interaction">Search ⌘K / Ctrl K</button></div></header>
  <div class="shell"><aside aria-label="Main navigation" id="epm-nav"></aside><main id="epm-main"></main></div>
  <footer class="footer"><span>Design preview · Fictional sample records</span><span>Local workspace · No external actions</span></footer>
</div>
<script>
(()=>{
const root=document.getElementById('epm-design');
const main=root.querySelector('#epm-main');
const nav=root.querySelector('#epm-nav');
const defaults=['Properties','Owners','Leasing','Money','Maintenance'];
const state={page:'Home',tab:'Needs action',section:'Overview',hidden:[],order:[...defaults],detail:'',quiet:false,density:'Comfortable',search:'',propertyId:'',ownerId:'',propertyQuery:'',ownerQuery:'',occupancyFilter:'All',aiProvider:'Muse',aiKill:false,theme:window.matchMedia?.('(prefers-color-scheme: dark)')?.matches?'dark':'light'};
const properties=[
 {id:'oak',name:'12 Oak Street',type:'Single-family home',owner:'alex',occupancy:'Occupied',availability:'Not available',tenant:'Maya Chen',lease:'Through Jun 30, 2027',attention:'Urgent repair',tone:'danger',review:false},
 {id:'pine',name:'48 Pine Avenue',type:'Townhome',owner:'alex',occupancy:'Occupied',availability:'Not available',tenant:'Jordan Brooks',lease:'Through Jan 31, 2027',attention:'Rent schedule review',tone:'warn',review:true},
 {id:'cedar',name:'7 Cedar Lane',type:'Condo',owner:'priya',occupancy:'Vacant',availability:'Available for leasing',tenant:'',lease:'No current lease',attention:'No actions due',tone:'',review:false},
 {id:'maple',name:'90 Maple Court',type:'Single-family home',owner:'',occupancy:'Occupied',availability:'Not available',tenant:'Taylor Reed',lease:'Through May 31, 2027',attention:'No actions due',tone:'',review:false}
];
const owners=[{id:'alex',name:'Alex Morgan',initials:'AM',attention:'Repair update requested',tone:'warn'},{id:'priya',name:'Priya Shah',initials:'PS',attention:'No actions due',tone:''}];
function propertyCards(items){return items.length?`<div class="property-grid">${items.map(p=>`<article class="property-card"><div class="property-mark"><i data-lucide="house" aria-hidden="true"></i><span>${p.type}</span></div><div class="property-content"><h2>${p.name}</h2><p class="muted">Portland, OR · ${p.owner?owners.find(o=>o.id===p.owner).name:'Self-owned'}</p><div class="coverline"><span>${p.occupancy}</span><small>${p.availability}</small></div><p>${p.tenant||'No current tenant'}</p><small>${p.lease}</small><div class="cardbottom">${tag(p.attention,p.tone)}${button('Open property →','property',p.id,'link')}</div></div></article>`).join('')}</div>`:'<div class="quiet"><h2>No matching properties</h2><p class="muted">Try another name or occupancy filter.</p></div>';}
function filteredProperties(){return properties.filter(p=>(state.occupancyFilter==='All'||(state.occupancyFilter==='Needs review'?p.review:p.occupancy===state.occupancyFilter))&&[p.name,p.tenant,p.owner?owners.find(o=>o.id===p.owner).name:'Self-owned'].join(' ').toLowerCase().includes(state.propertyQuery.toLowerCase()));}
function propertiesView(){
 if(!state.propertyId){const items=filteredProperties();return head('PORTFOLIO','Properties','4 properties · 3 occupied · 1 vacant')+`<div class="directory-controls"><label>Find a property<input id="epm-property-query" placeholder="Address, tenant, or owner" value="${escape(state.propertyQuery)}"></label><label>Show<select id="epm-property-filter">${['All','Occupied','Vacant','Needs review'].map(v=>`<option ${v===state.occupancyFilter?'selected':''}>${v}</option>`).join('')}</select></label></div><p id="epm-property-count" class="muted" aria-live="polite">Showing ${items.length} of ${properties.length} properties</p><div id="epm-property-results">${propertyCards(items)}</div>`;}
 const p=properties.find(x=>x.id===state.propertyId);
 const back=`<div class="workspace-back">${button('← All properties','directory','Properties','link')}<label>Switch property<select id="epm-switch-property" aria-label="Switch property">${properties.map(x=>`<option value="${x.id}" ${p.id===x.id?'selected':''}>${x.name}</option>`).join('')}</select></label></div>`;
 if(p.id==='oak')return back+property();
 return back+head('PROPERTY WORKSPACE',p.name,`Portland, OR · ${p.type} · America/Los_Angeles`)+`<div>${tag(p.occupancy)} <span class="muted">${p.availability} · ${p.owner?'Managed for':'Self-owned'}</span> ${p.owner?button(owners.find(x=>x.id===p.owner).name,'owner',p.owner,'link'):''}</div>`+tabs(['Overview','Spaces','Leases','Money','Maintenance','Conversations','Documents','Details'],state.section)+otherPropertyBody(p);
}
function otherPropertyBody(p){
 const empty=(title,text)=>`<section class="panel"><div class="coverage"><h2>${title}</h2><p class="muted">${text}</p></div></section>`;
 const lease=p.tenant?row(p.tenant,p.lease,'Executed','View lease',`property-lease:${p.id}`):'';
 if(state.section==='Overview')return `<section class="panel"><div class="panelhead"><h2>Next actions</h2><small>${p.id==='pine'?'1 action · 1 information review':'No actions due today'}</small></div>${p.id==='pine'?row('September rent still due','Expected $1,850 · Received $1,200','Overdue · $650 remaining','Record payment','payment','warn')+row('Rent schedule needs review','Lease terms changed Sep 20','Needs review','Review coverage','coverage','warn'):`<div class="coverage"><p>No actions due today.</p><p class="muted">${p.id==='cedar'?'Vacant and available for leasing.':'Future lease dates remain available in Leases.'}</p></div>`}</section><div class="two"><section class="panel"><div class="panelhead"><h2>${p.tenant?'Current lease':'Availability'}</h2></div>${p.tenant?lease:`<div class="coverage"><p>Vacant · Available for leasing</p><p class="muted">No current lease recorded.</p></div>`}</section><section class="panel"><div class="panelhead"><h2>Coverage</h2>${button('Review','detail',`property-coverage:${p.id}`,'link')}</div><div class="coverage"><div class="coverline"><span>Occupancy & availability</span><span>Recorded</span></div><div class="coverline"><span>Lease context</span><span>${p.tenant?'Recorded':'Not applicable · Vacant'}</span></div><div class="coverline"><span>Rent schedule</span><span class="${p.review?'textwarn':''}">${p.review?'Needs review':p.tenant?'Recorded':'Not applicable'}</span></div></div></section></div>`;
 if(state.section==='Spaces')return `<section class="panel">${row('Main space',`${p.occupancy} · ${p.availability}`,'Recorded','Review context',`property-coverage:${p.id}`)}</section>`;
 if(state.section==='Leases')return lease?`<section class="panel">${lease}</section>`:empty('No current lease','This space is recorded as vacant.');
 if(state.section==='Money')return p.id==='pine'?`<section class="panel">${row('September rent · $650 still due',p.name,'Overdue','Record payment','payment','warn')}${row('Security deposit','Separate from rent income','','View deposit','settlement')}</section>`:empty('No money records in this sample','Unavailable sample amounts are not shown as zero.');
 if(state.section==='Maintenance')return empty('No issues recorded','This does not establish that no maintenance is needed.');
 if(state.section==='Conversations')return empty('No conversations recorded','Recorded interactions for this property will appear here.');
 if(state.section==='Documents')return empty('No documents in this sample','Linked property and lease documents will appear here.');
 return empty('Property details',`${p.name} · ${p.type} · ${p.owner?owners.find(x=>x.id===p.owner).name:'Self-owned'} · 1 rentable space`);
}
function ownerRows(items){return items.length?items.map(o=>{const related=properties.filter(p=>p.owner===o.id);return `<div class="row"><span class="avatar">${o.initials}</span><div class="grow"><h2>${o.name}</h2><p>${related.length} ${related.length===1?'property':'properties'} · ${related.map(x=>x.name).join(' · ')}</p>${tag(o.attention,o.tone)}</div>${button('Open owner →','owner',o.id,'link')}</div>`;}).join(''):'<div class="quiet"><h2>No matching owners</h2><p class="muted">Try another name or property address.</p></div>';}
function filteredOwners(){return owners.filter(o=>[o.name,...properties.filter(p=>p.owner===o.id).map(p=>p.name)].join(' ').toLowerCase().includes(state.ownerQuery.toLowerCase()));}
function ownersView(){
 if(!state.ownerId){const items=filteredOwners();return head('OWNER DIRECTORY','Owners','2 client owners · 3 related properties')+`<div class="directory-controls"><label>Find an owner<input id="epm-owner-query" placeholder="Owner name or property address" value="${escape(state.ownerQuery)}"></label></div><p id="epm-owner-count" class="muted" aria-live="polite">Showing ${items.length} of ${owners.length} owners</p><section class="panel" id="epm-owner-results">${ownerRows(items)}</section><p class="muted directory-note">Self-owned properties remain in Properties; they do not require a client-owner record.</p>`;}
 const o=owners.find(x=>x.id===state.ownerId);
 const back=`<div class="workspace-back">${button('← All owners','directory','Owners','link')}<label>Switch owner<select id="epm-switch-owner" aria-label="Switch owner">${owners.map(x=>`<option value="${x.id}" ${o.id===x.id?'selected':''}>${x.name}</option>`).join('')}</select></label></div>`;
 if(o.id==='alex')return back+owner();
 const related=properties.filter(x=>x.owner===o.id);
 let body='';
 if(state.section==='Overview'||state.section==='Properties')body=propertyCards(related)+(state.section==='Overview'?`<section class="panel"><div class="coverage"><h2>No owner actions due today</h2><p class="muted">1 vacant property · Available for leasing</p></div></section>`:'');
 else if(state.section==='Details')body=`<section class="panel"><div class="coverage"><h2>${o.name}</h2><p>Individual · Current client owner of 7 Cedar Lane</p><p class="muted">Ownership percentages are not recorded.</p></div></section>`;
 else{const text={Money:'No money records in this sample. Owner entitlement is not inferred from property ownership.',Leases:'No current leases recorded. 7 Cedar Lane is vacant.',Maintenance:'No issues recorded. This does not establish that no maintenance is needed.',Conversations:'No conversations recorded for this owner.'}[state.section];body=`<section class="panel"><div class="coverage"><h2>${state.section}</h2><p class="muted">${text}</p></div></section>`;}
 return back+head('OWNER WORKSPACE',o.name,'1 current property · Client owner')+tabs(['Overview','Properties','Money','Leases','Maintenance','Conversations','Details'],state.section)+body;
}
const icons={Home:'layout-dashboard',Properties:'house',Owners:'users',Leasing:'file-text',Money:'wallet',Maintenance:'wrench',Settings:'settings',More:'ellipsis'};
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function restore(s){if(!s)return;const p=s.privateContent||{};if(['Home',...defaults,'Settings','More'].includes(p.page))state.page=p.page;if(Array.isArray(p.hidden))state.hidden=p.hidden.filter(x=>defaults.includes(x));if(Array.isArray(p.order)&&p.order.length===5&&new Set(p.order).size===5&&p.order.every(x=>defaults.includes(x)))state.order=p.order;if(['Comfortable','Compact'].includes(p.density))state.density=p.density;if(typeof p.quiet==='boolean')state.quiet=p.quiet;if(['light','dark'].includes(p.theme))state.theme=p.theme;}
restore(window.openai?.widgetState);
function save(){window.openai?.setWidgetState?.({modelContent:{preview:'UI-001',density:state.density,quietDay:state.quiet,appearance:state.theme,hiddenDestinations:state.hidden},privateContent:{page:state.page,hidden:state.hidden,order:state.order,density:state.density,quiet:state.quiet,theme:state.theme}})?.catch(()=>{});}
const button=(label,action,value='',cls='')=>`<button type="button" class="cursor-interaction ${cls}" data-action="${action}" data-value="${escape(value)}" ${action==='detail'?'aria-expanded="false"':''}>${label}${action==='detail'?'<span class="toggle-chevron" aria-hidden="true">⌄</span>':''}</button>`;
const tag=(label,kind='')=>`<span class="tag ${kind}">${label}</span>`;
function row(title,context,status,action,value,kind=''){return `<div class="row">${kind==='danger'?'<span class="urgent-dot" aria-hidden="true"></span>':''}<div class="grow"><h3>${title}</h3><p>${context}</p>${status?tag(status,kind):''}</div>${button(action,'detail',value,'link')}</div>`;}
function tabs(items,current,type='section'){return `<div class="tabs" aria-label="${type==='tab'?'Attention views':'Workspace sections'}">${items.map(x=>`<button type="button" class="cursor-interaction" aria-pressed="${x===current}" data-action="${type}" data-value="${escape(x)}">${x}</button>`).join('')}</div>`;}
function head(kicker,title,sub,action=''){return `<div class="pagehead"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="muted">${sub}</p></div>${action}</div>`;}
function home(){let queue='';if(state.tab==='Needs action'){queue=state.quiet?`<div class="quiet"><h2>No actions due today</h2><p class="muted">1 waiting · 2 upcoming · 1 information review</p></div>`:row('Kitchen leak needs your decision','12 Oak Street · Reported by tenant Maya Chen','Urgent · Reported today','Review issue','repair','danger')+row('September rent still due','48 Pine Avenue · Jordan Brooks · Due Sep 1','Overdue · $650 remaining','Record payment','payment','warn')+row('Verify rent received by owner','Alex Morgan · 12 Oak Street · Evidence attached','Review needed','Review report','report');}else if(state.tab==='Waiting'){queue=state.quiet?row('Renewal response','12 Oak Street · Waiting for Maya Chen','Follow up Sep 28','View lease','lease'):row('Kitchen repair estimate','12 Oak Street · Waiting for Northside Plumbing','Follow up Sep 23','View follow-up','waiting');}else{queue=row('Deposit refund follow-up','48 Pine Avenue · Due Sep 25','In 3 days','View settlement','settlement')+row('Review lease renewal','12 Oak Street · Due Sep 28','In 6 days','View lease','lease');}
return head('TUESDAY, SEPTEMBER 22','Your day, in view',state.quiet?'No actions due today. Your upcoming work is below.':'3 items need action across 2 properties.')+`<div class="appointment"><strong>${state.quiet?'Next · Sep 25':'Today · 2:00 PM PDT'}</strong><div class="grow">${state.quiet?'Deposit follow-up':'Plumber visit'} <span class="muted">· ${state.quiet?'48 Pine Avenue':'12 Oak Street'}</span></div>${button('View','detail',state.quiet?'settlement':'appointment','link')}</div>`+tabs(['Needs action','Waiting','Upcoming'],state.tab,'tab')+`<section class="panel" aria-label="Attention queue"><div class="panelhead"><h2>${state.tab}</h2><small>${state.tab==='Needs action'?(state.quiet?'0 items':'All 3 items'):state.tab==='Waiting'?'All 1 item':'Next 7 days · 2 items'}</small></div>${queue}</section><section class="panel"><div class="panelhead"><h2>Information to review</h2><small>1 property</small></div>${row('Rent schedule needs review','48 Pine Avenue · Lease terms changed Sep 20','Does not change recorded payments','Review coverage','coverage','warn')}</section>`;}
function owner(){return `<div class="breadcrumb">Owners / Alex Morgan</div>`+head('OWNER WORKSPACE','Alex Morgan','2 current properties · Client owner',button('Record conversation','detail','conversation','primary'))+tabs(['Overview','Properties','Money','Leases','Maintenance','Conversations','Details'],state.section)+ownerBody();}

ed externally','Open','conversation')}</section>`;if(state.section==='Leases')return `<section class="panel">${row('Maya Chen · 12 Oak Street','Executed · Jul 1, 2026 – Jun 30, 2027','','View lease','lease')}${row('Jordan Brooks · 48 Pine Avenue','Executed · Through Jan 31, 2027','','Review setup','coverage')}</section>`;return `<section class="panel"><div class="coverage"><h2>Owner details</h2><p>Alex Morgan · Individual</p><p class="muted">Current relationships: 12 Oak Street and 48 Pine Avenue</p><p class="muted">Ownership percentages are not recorded.</p>${button('View relationship history','detail','history','link')}</div></section>`;}
function property(){return `<div class="breadcrumb">Properties / 12 Oak Street</div>`+head('PROPERTY WORKSPACE','12 Oak Street','Portland, OR · Single-family home · America/Los_Angeles',button('Record conversation','detail','conversation','primary'))+`<div>${tag('Occupied')} <span class="muted">Not available for leasing · Managed for </span>${button('Alex Morgan','owner','alex','link')}</div>`+tabs(['Overview','Spaces','Leases','Money','Maintenance','Conversations','Documents','Details'],state.section)+propertyBody();}

anel">${row('Lease agreement','Linked to Maya Chen’s executed lease','Source record','View context','lease')}</section>`;return `<section class="panel"><div class="coverage"><h2>Property details</h2><p>12 Oak Street · Portland, Oregon</p><p class="muted">Single-family home · 1 rentable space</p><p>Client owner: Alex Morgan</p>${button('View ownership history','detail','history','link')}</div></section>`;}
function settings(){return head('SETTINGS','Make this workspace yours','Choose your appearance, AI provider, and permanent destinations.')+appearancePanel()+aiProviderPanel()+`<section class="panel"><div class="panelhead"><h2>Permanent destinations</h2>${button('Restore defaults','reset','','link')}</div><div class="settingrow"><strong>Home</strong><small>Always visible</small></div>${state.order.map((n,i)=>`<div class="settingrow"><label><input type="checkbox" data-destination="${n}" ${state.hidden.includes(n)?'':'checked'}> ${n}</label>${i?button('↑','up',n):''}${i<state.order.length-1?button('↓','down',n):''}</div>`).join('')}<div class="settingrow"><strong>Settings</strong><small>Always visible</small></div><div class="coverage"><p class="muted">Hidden destinations remain under More. Their unresolved work stays on Home.</p></div></section><section class="panel"><div class="panelhead"><h2>Data & backup</h2></div><div class="coverage"><p>Workspace available · Last backup today, 8:10 AM</p><small>Illustrative status for this design preview</small></div></section>`;}

function detail(){if(!state.detail)return '';let title='',body='';const kind=state.detail;if(kind==='search'){title='Find a record';body=`<label>Search sample records<input id="epm-search" value="${escape(state.search)}" placeholder="Property, owner, tenant, or issue"></label><div id="epm-results"></div>`;}else if(kind==='repair'){title='Kitchen leak';body=`${tag('Urgent','danger')} <span class="muted">12 Oak Street · Reported by Maya Chen</span><p>Water collecting below the kitchen sink. Plumber visit scheduled for today.</p><div class="coverline"><span>Next action</span><strong>Review response and visit plan</strong></div><div class="coverline"><span>Appointment</span><span>Today · 2:00 PM PDT</span></div><div class="coverline"><span>Owner update</span><span>Still open</span></div><p class="muted">Completing the visit does not resolve this issue or its follow-up.</p><div class="actions">${button('Review completion','detail','completion','primary')}${button('View waiting context','detail','waiting')}</div>`;}else if(kind==='completion'){title='Review repair completion';body=`<p>These records have separate outcomes.</p><div class="coverline"><span>Work outcome</span><span>Not recorded</span></div><div class="coverline"><span>Operator verification</span><span>Pending</span></div><div class="coverline"><span>Appointment</span><span class="textwarn">Still scheduled · Resolve this first</span></div><div class="coverline"><span>Owner update task</span><span>Open</span></div><div class="notice">Issue resolution is blocked while its appointment remains scheduled.</div>`;}else if(kind==='payment'){title='Record rent payment';body=`<p>48 Pine Avenue · Jordan Brooks · September rent</p><div class="fields"><label>Amount received<input inputmode="decimal" value="650.00" aria-label="Payment amount" readonly></label><label>Date received<input type="date" value="2026-09-22" readonly></label></div><div class="coverline"><span>Actual method</span><span>Bank transfer · Editable prefill</span></div><div class="coverline"><span>Received by</span><span>Local operator</span></div><div class="coverline"><span>Allocated to September</span><span>$650.00</span></div><div class="coverline"><span>Still due after recording</span><span>$0.00</span></div><small>Review-state example · No payment is recorded in this preview.</small>`;}else if(kind==='coverage'){title='Rent schedule needs review';body=`<p>48 Pine Avenue · Lease terms changed Sep 20.</p><div class="notice">Existing recorded payments are unchanged.</div><p>Review the selected term, recurrence anchor, covered periods, and prorated amounts before confirming the new rent schedule.</p><div class="coverline"><span>Lease</span><span>Recorded</span></div><div class="coverline"><span>Rent schedule</span><span class="textwarn">Needs review</span></div><p class="muted">This review clears when the schedule is confirmed against the current terms.</p>`;}else if(kind==='report'){title='Review owner-reported rent';body=`<p>Alex Morgan · 12 Oak Street · $1,850 reported Sep 21</p><div class="two"><section class="panel"><div class="coverage"><h3>Reported details</h3><p>September rent · Bank transfer</p><p>Evidence: payment confirmation</p></div></section><section class="panel"><div class="coverage"><h3>Matching payment</h3><p>$1,850 · Sep 21 · September rent</p><p class="muted">Review compatibility before linking.</p></div></section></div><div class="notice">Pending report · Not additional income. Verification links one authoritative receipt.</div>`;}else if(kind==='conversation'){title='Conversation with Alex Morgan';body=`<p>Call · Sep 21, 10:30 AM PDT · Recorded externally</p><p>Discussed the kitchen leak and requested an update after the plumber visit.</p><div class="coverline"><span>Related property</span><span>12 Oak Street</span></div><div class="coverline"><span>Follow-up</span><span>Update Alex after visit · Open</span></div><small>Recording a conversation does not send a message.</small>`;}else if(kind==='waiting'){title='Waiting for repair estimate';body=`<p>12 Oak Street · Northside Plumbing</p><div class="coverline"><span>Follow up</span><span>Sep 23</span></div><div class="coverline"><span>Source issue</span><span class="textwarn">Urgent · Still unresolved</span></div><p class="muted">The follow-up date does not change issue priority or its original deadlines.</p>`;}else if(kind==='settlement'){title='Deposit settlement';body=`<p>48 Pine Avenue · Lease context</p><div class="coverline"><span>Settlement</span><span>Draft</span></div><div class="coverline"><span>Deductions</span><span>Require explicit evidence and approval</span></div><div class="coverline"><span>Refund</span><span>Not recorded</span></div><p class="muted">An inspection finding does not automatically create a deduction. Recording a refund does not transfer money.</p>`;}else if(kind==='lease'){title='Maya Chen · Executed lease';body=`<p>12 Oak Street · Jul 1, 2026 – Jun 30, 2027</p><div class="coverline"><span>Rent</span><span>$1,850 / month</span></div><div class="coverline"><span>Rent schedule</span><span>Confirmed</span></div><div class="coverline"><span>Occupancy</span><span>Lease-owned · Occupied</span></div><p class="muted">The lease end date alone does not confirm move-out or availability.</p>`;}else{const content={appointment:['Plumber visit','12 Oak Street · Today, 2:00 PM PDT','Scheduled appointment · Completion does not resolve the repair.'],concern:['Owner concern','Alex Morgan requested a repair update.','Open · Linked issue and conversation retain their own status.'],history:['Relationship history','Alex Morgan · Current client owner','Historical records remain available after a relationship ends.'],expense:['Paid plumbing expense','$175 · Sep 15','Confirmed spending. Quotes and estimates are separate records.'],check:['Scheduled October check','One full October rent period · Eligible Oct 1','Not received income. Deposit confirmation is a separate explicit action.']}[kind]||['Record','Sample detail',''];[title,...body]=content;body=body.map(x=>`<p>${x}</p>`).join('');}
return `<section class="drawer" aria-label="${escape(title)}"><div class="drawerhead"><h2>${title}</h2>${button('Collapse','close')}</div>${body}</section>`;}
function render(){root.style.colorScheme=state.theme;root.style.setProperty('--epm-pad',state.density==='Compact'?'13px':'20px');nav.innerHTML=['Home',...state.order.filter(n=>!state.hidden.includes(n)),...(state.hidden.length?['More']:[])].map(n=>`<button type="button" class="cursor-interaction" data-action="nav" data-value="${n}" ${state.page===n?'aria-current="page"':''}><i data-lucide="${icons[n]}" aria-hidden="true"></i>${n}</button>`).join('')+`<div class="navfoot"><button type="button" class="cursor-interaction" data-action="nav" data-value="Settings" ${state.page==='Settings'?'aria-current="page"':''}><i data-lucide="settings" aria-hidden="true"></i>Settings</button><div class="status">Workspace available<br>Backup today · 8:10 AM</div></div>`;main.innerHTML=(state.page==='Home'?home():state.page==='Owners'?ownersView():state.page==='Properties'?propertiesView():state.page==='Settings'?settings():basic())+detail();globalThis.lucide?.createIcons({attrs:{width:16,height:16}});if(main.querySelector('[data-action=detail]'))main.querySelector('.pagehead')?.insertAdjacentHTML('afterend',toggleHint());if(state.detail==='search')results();applyTheme();}
function results(){const el=root.querySelector('#epm-results');if(!el)return;const data=[...properties.map(p=>[p.name,`Property · ${p.occupancy}`,'property',p.id]),...owners.map(o=>[o.name,`Owner · ${properties.filter(p=>p.owner===o.id).length} related properties`,'owner',o.id]),['Maya Chen','Tenant · Lease at 12 Oak Street','nav','Leasing'],['Kitchen leak','Maintenance · 12 Oak Street','nav','Maintenance']];const found=data.filter(x=>x.join(' ').toLowerCase().includes(state.search.toLowerCase()));el.innerHTML=found.length?found.map(x=>button(`<strong>${x[0]}</strong><br><small>${x[1]}</small>`,x[2],x[3],'result')).join(''):'<p>No matching sample records.</p>';}
function toggleHint(){return '<p class="toggle-hint"><span aria-hidden="true">⌄</span> Click an action to expand its details below. Click it again to collapse.</p>';}
function appearancePanel(){return `<section class="panel"><div class="panelhead"><h2>Appearance</h2><div class="appearance-options" aria-label="Color mode"><button type="button" class="cursor-interaction" data-action="appearance" data-value="light" aria-pressed="${state.theme==='light'}">Light</button><button type="button" class="cursor-interaction" data-action="appearance" data-value="dark" aria-pressed="${state.theme==='dark'}">Dark</button></div></div><div class="coverage"><p class="muted">Your preference is remembered. Switching modes preserves your work.</p></div></section>`;}
function aiProviderPanel(){return `<section class="panel"><div class="panelhead"><h2>AI provider</h2>${state.aiKill?tag('Paused','warn'):tag(state.aiProvider+' active')}</div><div class="settingrow"><div class="grow"><strong>Provider</strong><p>Muse is the recommended provider. Switching affects new AI runs only; in-flight runs keep their recorded provider.</p></div><div class="appearance-options" role="group" aria-label="AI provider"><button type="button" class="cursor-interaction" data-action="ai-provider" data-value="Muse" aria-pressed="${state.aiProvider==='Muse'}">Muse (recommended)</button><button type="button" class="cursor-interaction" data-action="ai-provider" data-value="Other" aria-pressed="${state.aiProvider==='Other'}">Other</button></div></div><div class="settingrow"><div class="grow"><strong>API key</strong><p>Stored in your system credential store, never in the workspace database or backups.</p></div>${tag('Configured')}${button('Replace','ai-key','','link')}</div><div class="settingrow"><label><input type="checkbox" data-ai="kill"${state.aiKill?' checked':''}> <strong>Pause all AI assistance</strong></label></div>${state.aiKill?'<div class="coverage"><p class="muted">While paused, every AI run fails closed. Drafts already awaiting review are kept.</p></div>':''}<div class="panelhead"><h2>Action limits</h2></div><div class="settingrow"><div class="grow"><strong>Issue drafts</strong><small>Redaction profile standard-v3 \u00b7 20 runs/day \u00b7 8k tokens per run</small></div><label><input type="checkbox" checked> Enabled</label></div><div class="settingrow"><div class="grow"><strong>Voice transcription</strong><small>Redaction profile voice-v2 \u00b7 50 runs/day \u00b7 4k tokens per run</small></div><label><input type="checkbox" checked> Enabled</label></div><div class="settingrow"><div class="grow"><strong>Document drafts</strong><small>Redaction profile standard-v3 \u00b7 20 runs/day \u00b7 8k tokens per run</small></div><label><input type="checkbox" checked> Enabled</label></div><div class="coverage"><p class="muted">Limits and the pause switch are enforced before any provider call. Nothing here approves a draft.</p></div></section>`;}
function applyTheme(){root.style.colorScheme=state.theme;root.querySelectorAll('[data-action=appearance]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.value===state.theme)));}
let expansionSequence=0;
function expansionMarkup(value){
 if(value.startsWith('property-')){
  const [kind,id]=value.split(':');const p=properties.find(x=>x.id===id);if(!p)return '';
  const title=kind==='property-lease'?`${p.tenant} · Lease`:`Coverage · ${p.name}`;
  const body=kind==='property-lease'?`<p>${p.name} · ${p.lease}</p><div class="coverline"><span>Lease state</span><span>Executed</span></div><div class="coverline"><span>Rent schedule</span><span>${p.review?'Needs review':'Confirmed'}</span></div>`:`<p>${p.name}</p><div class="coverline"><span>Occupancy & availability</span><span>${p.occupancy} · ${p.availability}</span></div><div class="coverline"><span>Lease context</span><span>${p.tenant?'Recorded':'Not applicable · Vacant'}</span></div><div class="coverline"><span>Rent schedule</span><span>${p.review?'Needs review':p.tenant?'Recorded':'Not applicable'}</span></div><p class="muted">${p.review?'Lease terms changed Sep 20. Review the rent schedule against the current terms.':'Recorded information is distinct from a guarantee that no work remains.'}</p>`;
  return `<section class="drawer" aria-label="${escape(title)}"><div class="drawerhead"><h2>${title}</h2>${button('Collapse','close')}</div>${body}</section>`;
 }
 const previous=state.detail;state.detail=value;const markup=detail();state.detail=previous;return markup;
}
function toggleInline(trigger){
 const existingId=trigger.getAttribute('aria-controls');let panel=existingId?root.querySelector(`#${existingId}`):null;
 if(panel){panel.hidden=!panel.hidden;trigger.setAttribute('aria-expanded',String(!panel.hidden));return;}
 const holder=document.createElement('div');holder.innerHTML=expansionMarkup(trigger.dataset.value);panel=holder.firstElementChild;if(!panel)return;
 panel.id=`epm-expansion-${++expansionSequence}`;panel.classList.add('inline-expansion');panel.dataset.inline='true';panel.trigger=trigger;panel.setAttribute('role','region');
 const anchor=trigger.closest('.actions, .row, .appointment, .panelhead, .coverage, .pagehead')||trigger;
 anchor.insertAdjacentElement('afterend',panel);trigger.setAttribute('aria-controls',panel.id);trigger.setAttribute('aria-expanded','true');globalThis.lucide?.createIcons({attrs:{width:16,height:16}});
}
function collapseInline(panel){panel.hidden=true;panel.trigger?.setAttribute('aria-expanded','false');panel.trigger?.focus();}
root.addEventListener('click',e=>{
 const b=e.target.closest('button[data-action]');if(!b)return;const a=b.dataset.action,v=b.dataset.value;
 if(a==='appearance'){state.theme=v;applyTheme();save();return;}
 if(a==='ai-provider'){state.aiProvider=v;render();save();return;}
 if(a==='detail'){toggleInline(b);return;}
 if(a==='close'&&b.closest('[data-inline]')){collapseInline(b.closest('[data-inline]'));return;}
 if(a==='nav'||a==='directory'){state.page=v;state.section=v==='Money'?'Rent':'Overview';state.detail='';state.propertyId='';state.ownerId='';}
 if(a==='property'){state.page='Properties';state.propertyId=v;state.section='Overview';state.detail='';}
 if(a==='owner'){state.page='Owners';state.ownerId=v;state.section='Overview';state.detail='';}
 if(a==='tab'){state.tab=v;state.detail='';}if(a==='section'){state.section=v;state.detail='';}if(a==='close')state.detail='';if(a==='search')state.detail=state.detail==='search'?'':'search';
 if(a==='reset'){state.order=[...defaults];state.hidden=[];}if(a==='up'||a==='down'){const i=state.order.indexOf(v),j=i+(a==='up'?-1:1);if(j>=0&&j<state.order.length)[state.order[i],state.order[j]]=[state.order[j],state.order[i]];}
 render();save();if(a==='search')root.querySelector('#epm-search')?.focus();
});
root.addEventListener('change',e=>{
 if(e.target.id==='epm-property-filter'){state.occupancyFilter=e.target.value;refreshDirectory();return;}
 if(e.target.id==='epm-switch-property'){state.propertyId=e.target.value;state.section='Overview';render();save();return;}
 if(e.target.id==='epm-switch-owner'){state.ownerId=e.target.value;state.section='Overview';render();save();return;}
 const ai=e.target.dataset.ai;if(ai==='kill'){state.aiKill=e.target.checked;render();save();return;}
 const d=e.target.dataset.destination;if(!d)return;state.hidden=state.hidden.filter(x=>x!==d);if(!e.target.checked)state.hidden.push(d);render();save();
});
function refreshDirectory(){
 const propertyResults=root.querySelector('#epm-property-results');if(propertyResults){const items=filteredProperties();propertyResults.innerHTML=propertyCards(items);root.querySelector('#epm-property-count').textContent=`Showing ${items.length} of ${properties.length} properties`;}
 const ownerResults=root.querySelector('#epm-owner-results');if(ownerResults){const items=filteredOwners();ownerResults.innerHTML=ownerRows(items);root.querySelector('#epm-owner-count').textContent=`Showing ${items.length} of ${owners.length} owners`;}
 globalThis.lucide?.createIcons({attrs:{width:16,height:16}});
}
root.addEventListener('input',e=>{if(e.target.id==='epm-search'){state.search=e.target.value;results();}if(e.target.id==='epm-property-query'){state.propertyQuery=e.target.value;refreshDirectory();}if(e.target.id==='epm-owner-query'){state.ownerQuery=e.target.value;refreshDirectory();}});
root.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();state.detail='search';render();root.querySelector('#epm-search')?.focus();}if(e.key==='Escape'){const panel=e.target.closest('[data-inline]');if(panel){collapseInline(panel);return;}if(state.detail){state.detail='';render();}}});
window.addEventListener('openai:set_globals',e=>{restore(e.detail?.globals?.widgetState);render();});
render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{render();save();}});tweak.addSelect(state,'density',{label:'Row spacing',options:['Comfortable','Compact']});tweak.addToggle(state,'quiet',{label:'Quiet-day Home'});}
})();
</script>
