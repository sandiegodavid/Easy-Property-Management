[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-property-management"
version = "0.1.0"
description = "Local-first, AI-assisted property management"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2.0",
  "cryptography>=45,<47",
  "fastapi>=0.115,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "keyring>=25,<27",
  "pydantic>=2.7,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
s3 = [
  "boto3>=1.35,<2.0",
]
dev = [
  "httpx2>=2.0,<3.0",
  "pytest>=8.0,<9.0",
]

[tool.setuptools]
package-dir = {"" = "apps/server"}

[tool.setuptools.packages.find]
where = ["apps/server"]

[tool.pytest.ini_options]
testpaths = ["apps/server/app"]

[tool.ruff]
# Target environment details
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# Enable Pyflakes (F), Pycodestyle (E), McCabe Complexity (C90), and Pylint (PL)
select = ["F", "E", "W", "C90", "PL"]

# Explicitly configure rule thresholds
[tool.ruff.lint.mccabe]
# Flags functions with cyclomatic complexity (branching/nested paths) higher than 10
max-complexity = 10

[tool.ruff.lint.pylint]
# Rule PLR0915: Flags functions containing more than 50 statements/lines of logic
max-statements = 50

# Rule PLR0913: Flags functions accepting more than 5 arguments
max-args = 5

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
