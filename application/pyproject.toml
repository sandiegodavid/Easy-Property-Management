[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-property-management"
version = "0.1.0"
description = "Local-first, AI-assisted property management"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2.0",
  "cryptography>=45,<47",
  "fastapi>=0.115,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "keyring>=25,<27",
  "pydantic>=2.7,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
s3 = [
  "boto3>=1.35,<2.0",
]
dev = [
  "httpx2>=2.0,<3.0",
  "pytest>=8.0,<9.0",
]

[tool.setuptools]
package-dir = {"" = "apps/server"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["apps/server"]

# Only compiled public web files belong in the wheel, never workspace content,
# source maps, environment files, or arbitrary contents of the build directory.
[tool.setuptools.package-data]
app = ["web_build/index.html", "web_build/assets/*.js", "web_build/assets/*.css",
       "web_build/assets/*.svg", "web_build/assets/*.png", "web_build/assets/*.jpg",
       "web_build/assets/*.webp", "web_build/assets/*.ico", "web_build/assets/*.woff2"]

[tool.pytest.ini_options]
testpaths = ["apps/server/app"]

[tool.ruff]
# Target environment details
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# Enable Pyflakes (F), Pycodestyle (E), McCabe Complexity (C90), and Pylint (PL)
select = ["F", "E", "W", "C90", "PL"]

# Module implementations contain intentionally large orchestration and schema
# validation functions. Keep correctness and import checks active while the
# module refactor is completed incrementally.
[tool.ruff.lint.per-file-ignores]
"apps/server/app/modules/**/*.py" = ["E501", "C90", "PL"]
# The initial schema migration intentionally defers model imports until upgrade,
# and its ordered DDL/rollback sequence is necessarily large. Keep migration SQL
# and migration-local imports out of these implementation-style checks.
"database/sqlite-migrations/versions/*.py" = ["E501", "PLC0415", "PLR0915"]

# Explicitly configure rule thresholds
[tool.ruff.lint.mccabe]
# Flags functions with cyclomatic complexity (branching/nested paths) higher than 10
max-complexity = 10

[tool.ruff.lint.pylint]
# Rule PLR0915: Flags functions containing more than 50 statements/lines of logic
max-statements = 50

# Rule PLR0913: Flags functions accepting more than 5 arguments
max-args = 5

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
