# Local containerized hosting test environment: Admin + Operator containers only.
# Other hosting services (Caddy, Cloudflare Tunnel, backup-proxy, guardian, egress-proxy,
# Ops Agent) are intentionally skipped.
name: epm-local-hosting-test

services:
  admin:
    container_name: epm-local-admin
    image: epm-local-hosting-test:dev
    build:
      context: ../../..
      dockerfile: deploy/hosted-mvp/local-test/Dockerfile
    command: ["/opt/epm/venv/bin/python", "-B", "/opt/epm/local-test/admin_server.py"]
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      EPM_LOCAL_AUTO_LOGIN: "${EPM_LOCAL_AUTO_LOGIN:-1}"
      PORT: "8000"
      HEALTH_PORT: "8081"
    ports:
      - "127.0.0.1:18801:8000"
    volumes:
      - epm_local_admin_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "/opt/epm/venv/bin/python",
          "-B",
          "-c",
          "import http.client; c=http.client.HTTPConnection('127.0.0.1',8081,timeout=2); c.request('GET','/health/live'); assert c.getresponse().status==200",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks: [local-test]

  operator:
    container_name: epm-local-operator
    image: epm-local-hosting-test:dev
    build:
      context: ../../..
      dockerfile: deploy/hosted-mvp/local-test/Dockerfile
    command: ["/opt/epm/venv/bin/python", "-B", "/opt/epm/local-test/operator_server.py"]
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      EPM_LOCAL_AUTO_LOGIN: "${EPM_LOCAL_AUTO_LOGIN:-1}"
      EPM_LOCAL_SEED_DEMO: "${EPM_LOCAL_SEED_DEMO:-1}"
      PORT: "8000"
      HEALTH_PORT: "8081"
    ports:
      - "127.0.0.1:18802:8000"
    volumes:
      - epm_local_operator_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "/opt/epm/venv/bin/python",
          "-B",
          "-c",
          "import http.client; c=http.client.HTTPConnection('127.0.0.1',8081,timeout=2); c.request('GET','/health/live'); assert c.getresponse().status==200",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [local-test]

volumes:
  epm_local_admin_data:
  epm_local_operator_data:

networks:
  local-test:
    driver: bridge
