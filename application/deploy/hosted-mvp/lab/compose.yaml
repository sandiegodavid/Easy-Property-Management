# Development-only unavailable candidates; not the native host sandbox or admission.
services:
  admin:
    image: ${EPM_ADMIN_IMAGE:?Set the exact verified Admin image ID}
    platform: linux/amd64
    command: ["--health-only"]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 64
    restart: "no"
    tmpfs: ["/tmp:rw,nosuid,nodev,size=64m"]
    ports: ["127.0.0.1:18801:8000"]
    networks: [lab]
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "2" }
  operator:
    image: ${EPM_OPERATOR_IMAGE:?Set the exact verified Operator image ID}
    platform: linux/amd64
    command: ["--health-only"]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 64
    restart: "no"
    tmpfs: ["/tmp:rw,nosuid,nodev,size=64m"]
    ports: ["127.0.0.1:18802:8000"]
    networks: [lab]
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "2" }
networks:
  lab:
    driver: bridge
